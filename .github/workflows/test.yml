name: Test formula

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  install:
    name: brew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: homebrew-noida

      - name: Install from this tap
        run: |
          set -euo pipefail
          brew tap its-banana-coder/noida "$PWD/homebrew-noida"
          brew install --verbose its-banana-coder/noida/noida
          noida --version
          noida --help | head -3
